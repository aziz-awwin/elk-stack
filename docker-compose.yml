version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-server
    ports:
      - "8080:80"
    volumes:
      - nginx_logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - log-network
    # Override the default command to fix log files first then start nginx
    command: >
      sh -c "
        echo 'Removing symlinks and creating real log files...' &&
        rm -f /var/log/nginx/access.log /var/log/nginx/error.log &&
        touch /var/log/nginx/access.log /var/log/nginx/error.log &&
        chmod 644 /var/log/nginx/access.log /var/log/nginx/error.log &&
        echo 'Log files created, starting nginx...' &&
        nginx -g 'daemon off;'
      "

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash-processor
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - nginx_logs:/var/log/nginx:ro
      - ./processed-logs:/var/log/output
    environment:
      - LS_JAVA_OPTS=-Xmx512m -Xms512m
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - log-network

  # Monitoring containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - log-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - log-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - log-network
    restart: unless-stopped

volumes:
  nginx_logs:
  grafana_data:

networks:
  log-network:
    driver: bridge