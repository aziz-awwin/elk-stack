input {
  file {
    path => "/var/log/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }
}

filter {
  # Parse nginx access logs with null safety
  grok {
    match => { 
      "message" => "%{COMBINEDAPACHELOG}" 
    }
    tag_on_failure => ["_grokparsefailure"]
  }
  
  # Only process successfully parsed logs
  if "_grokparsefailure" not in [tags] {
    
    # Parse the timestamp safely
    if [timestamp] {
      date {
        match => [ "timestamp" , "dd/MMM/yyyy:HH:mm:ss Z" ]
        tag_on_failure => ["_dateparsefailure"]
      }
    }
    
    # Convert fields to proper types with null checks
    if [response] {
      mutate {
        convert => { "response" => "integer" }
      }
    }
    
    if [bytes] and [bytes] != "-" {
      mutate {
        convert => { "bytes" => "integer" }
      }
    }
    
    # Add metadata fields
    mutate {
      add_field => { 
        "log_source" => "nginx"
      }
    }
    
    # Categorize responses safely
    if [response] {
      if [response] >= 400 {
        mutate {
          add_field => { "status_category" => "error" }
        }
      } else if [response] >= 300 {
        mutate {
          add_field => { "status_category" => "redirect" }
        }
      } else if [response] >= 200 {
        mutate {
          add_field => { "status_category" => "success" }
        }
      } else {
        mutate {
          add_field => { "status_category" => "info" }
        }
      }
    }
  }
}

output {
  # Console output for debugging (keep for now)
  stdout { 
    codec => rubydebug 
  }
  
  # Write all processed logs to JSON file
  file {
    path => "/var/log/output/nginx-processed-%{+YYYY-MM-dd}.json"
    codec => json_lines
  }
  
  # Write errors to separate file (using ECS format)
  if [http][response][status_code] and [http][response][status_code] >= 400 {
    file {
      path => "/var/log/output/nginx-errors-%{+YYYY-MM-dd}.log"
      codec => line {
        format => "%{@timestamp} - %{[source][address]} - %{[http][response][status_code]} - %{[http][request][method]} %{[url][original]} - %{[user_agent][original]}"
      }
    }
  }
  
  # Write successful requests to separate file
  if [http][response][status_code] and [http][response][status_code] >= 200 and [http][response][status_code] < 400 {
    file {
      path => "/var/log/output/nginx-success-%{+YYYY-MM-dd}.log"
      codec => line {
        format => "%{@timestamp} - %{[source][address]} - %{[http][response][status_code]} - %{[http][request][method]} %{[url][original]}"
      }
    }
  }
}